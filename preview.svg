<svg xmlns="http://www.w3.org/2000/svg" width="960" height="880" viewBox="0 0 960 880">
  <title>Konoproxy illustrative Home panel preview</title>
  <desc>A monochrome native proxy panel using fictional profile and node names. This is an illustration, not a screenshot of a live subscription.</desc>
  <rect width="960" height="880" fill="#171717"/>
  <rect x="100" y="44" width="760" height="768" rx="14" fill="#202020" stroke="#686868"/>
  <g font-family="DejaVu Sans Mono,monospace" fill="#dedede">
    <text x="140" y="98" font-size="28" font-weight="bold">Konoproxy</text>
    <text x="140" y="128" font-size="16" fill="#999999">Profile: Demo</text>
    <rect x="742" y="81" width="74" height="38" rx="19" fill="#444444" stroke="#999999"/>
    <circle cx="795" cy="100" r="13" fill="#dedede"/>
    <g font-size="18" text-anchor="middle">
      <text x="203" y="187">Home</text>
      <text x="340" y="187" fill="#999999">Nodes</text>
      <text x="477" y="187" fill="#999999">Profiles</text>
      <text x="614" y="187" fill="#999999">Rules</text>
      <text x="751" y="187" fill="#999999">Settings</text>
    </g>
    <path d="M140 207H820" stroke="#505050"/>
    <path d="M140 207H267" stroke="#dedede" stroke-width="3"/>
    <g font-size="15" fill="#999999">
      <text x="140" y="253">UPLOAD</text>
      <text x="495" y="253">DOWNLOAD</text>
    </g>
    <text x="140" y="292" font-size="27">↑ 12.4 KiB/s</text>
    <text x="495" y="292" font-size="27">↓ 86.2 KiB/s</text>
    <text x="140" y="329" font-size="16" fill="#999999">Session: ↑ 1.2 MiB · ↓ 8.4 MiB</text>
    <path d="M140 358H820" stroke="#505050"/>
    <text x="140" y="398" font-size="17" font-weight="bold">TRAFFIC CAPTURE</text>
    <rect x="140" y="422" width="328" height="54" rx="8" fill="#343434" stroke="#aaaaaa"/>
    <rect x="486" y="422" width="334" height="54" rx="8" fill="none" stroke="#555555"/>
    <g font-size="18" text-anchor="middle">
      <text x="304" y="455">System proxy</text>
      <text x="653" y="455">Tunnel proxy</text>
    </g>
    <text x="140" y="511" font-size="14" fill="#999999">System proxy: supported apps. Tunnel proxy: terminal traffic.</text>
    <path d="M140 540H820" stroke="#505050"/>
    <text x="140" y="580" font-size="17" font-weight="bold">PROXY MODE</text>
    <rect x="140" y="604" width="328" height="54" rx="8" fill="#343434" stroke="#aaaaaa"/>
    <rect x="486" y="604" width="334" height="54" rx="8" fill="none" stroke="#555555"/>
    <g font-size="18" text-anchor="middle">
      <text x="304" y="637">Rules</text>
      <text x="653" y="637">Global</text>
    </g>
    <text x="140" y="693" font-size="14" fill="#999999">Rules follow profile rules. Global uses the global policy.</text>
    <path d="M140 720H820" stroke="#505050"/>
    <text x="140" y="752" font-size="14" fill="#999999">CURRENT NODE</text>
    <text x="140" y="782" font-size="19">Demo JP node</text>
    <text x="480" y="850" font-size="14" text-anchor="middle" fill="#999999">Illustrative preview · fictional data</text>
  </g>
</svg>
